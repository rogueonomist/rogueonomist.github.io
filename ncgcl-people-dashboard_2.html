<style>
/* ==========================================================================
   NCGCL — Color tokens
   Derived from the corporate logo (blue #0C688D + green #39A935) and the colors
   used throughout the NCGCL Board Review deck. Petrol blue carries authority and
   AAA-grade trust; green signals growth and Shariah-compliant catalytic finance.
   ========================================================================== */
:root {
  /* ---- Brand core (straight from the logo) ---- */
  --ncgcl-blue:  #0C688D;   /* primary — falcon wing, headers, CTAs */
  --ncgcl-green: #39A935;   /* secondary — growth, positive, accent */

  /* ---- Petrol scale (deep institutional blue; backgrounds + chrome) ---- */
  --petrol-900: #042B3B;
  --petrol-800: #004C66;
  --petrol-700: #035076;
  --petrol-600: #0C688D;    /* == --ncgcl-blue */
  --petrol-500: #12678A;
  --petrol-400: #007AA0;
  --petrol-300: #4FA0BC;
  --petrol-200: #A7C7D6;
  --petrol-100: #E3EEF3;

  /* ---- Green scale (growth / catalytic) ---- */
  --green-800: #1F6A1D;
  --green-700: #2B8129;
  --green-600: #39A935;     /* == --ncgcl-green */
  --green-500: #4EA72E;
  --green-400: #5AB060;
  --green-300: #8CD872;
  --green-100: #E6F4E2;

  /* ---- Ink + neutral (text, lines, surfaces) ---- */
  --ink-900: #061626;
  --ink-800: #0E2841;
  --ink-700: #1E293B;
  --ink-600: #33424F;
  --slate-500: #5B6B7A;
  --slate-400: #7F7F7F;
  --slate-300: #AEAEAE;
  --slate-200: #C8D6E0;     /* brand light blue-grey — hairlines, dividers */
  --slate-150: #E2E8F0;
  --slate-100: #EEF1F4;
  --slate-50:  #F6F8FA;
  --paper:     #FFFFFF;

  /* ---- Semantic risk / status (from the Key Risks & traffic-light usage) ---- */
  --risk-high: #C00000;
  --risk-med:  #BF9000;
  --risk-low:  #2B8129;
  --status-positive: #2B8129;
  --status-negative: #C00000;
  --status-neutral:  #5B6B7A;

  /* =========================================================
     SEMANTIC ALIASES — reference these in product, not raw scale
     ========================================================= */
  --color-primary:        var(--ncgcl-blue);
  --color-primary-hover:  #0A5876;   /* darken on hover */
  --color-primary-press:  #084A63;
  --color-accent:         var(--ncgcl-green);
  --color-accent-hover:   #2F9A2B;
  --color-accent-press:   #287F25;

  --text-strong:   var(--ink-800);
  --text-body:     #1F2E3A;
  --text-muted:    var(--slate-400);
  --text-faint:    var(--slate-300);
  --text-on-dark:  #FFFFFF;
  --text-on-dark-muted: #B9CFDA;
  --text-link:     var(--petrol-400);

  --surface-page:   #FFFFFF;
  --surface-canvas: var(--slate-50);
  --surface-card:   #FFFFFF;
  --surface-muted:  var(--slate-100);
  --surface-dark:   var(--petrol-800);
  --surface-darker: var(--petrol-900);
  --surface-accent-soft: var(--green-100);
  --surface-primary-soft: var(--petrol-100);

  --border-subtle:  var(--slate-200);
  --border-strong:  #9FB5C4;
  --border-on-dark: rgba(255,255,255,0.16);

  --focus-ring: var(--petrol-400);
}
/* ==========================================================================
   NCGCL — Typography tokens
   Figtree for everything UI + display; IBM Plex Mono for figures & data tables.
   Institutional, structured, confident. Tight display tracking; generous body.
   ========================================================================== */
:root {
  --font-sans: "Figtree", "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  /* Display / heading face = sans (single-family system) */
  --font-display: var(--font-sans);
  --font-body:    var(--font-sans);
  --font-data:    var(--font-mono);

  /* ---- Type scale (1.250 major-third, rem @16px base) ---- */
  --text-display: 3.815rem;  /* 61px — cover hero */
  --text-h1: 3.052rem;       /* 49px */
  --text-h2: 2.441rem;       /* 39px */
  --text-h3: 1.953rem;       /* 31px */
  --text-h4: 1.563rem;       /* 25px */
  --text-h5: 1.25rem;        /* 20px */
  --text-lg: 1.125rem;       /* 18px */
  --text-base: 1rem;         /* 16px */
  --text-sm: 0.875rem;       /* 14px */
  --text-xs: 0.75rem;        /* 12px */
  --text-2xs: 0.6875rem;     /* 11px — eyebrow / data labels */

  /* ---- Weights ---- */
  --weight-light: 300;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --weight-extrabold: 800;

  /* ---- Line heights ---- */
  --leading-tight: 1.08;
  --leading-snug: 1.22;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* ---- Letter spacing ---- */
  --tracking-tighter: -0.03em;  /* big display */
  --tracking-tight: -0.015em;   /* headings */
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-eyebrow: 0.14em;   /* uppercase eyebrows / kickers */
}
/* ==========================================================================
   NCGCL — Spacing, radii, sizing, layout tokens
   8px base grid. Restrained, structured radii — institutional, not playful.
   ========================================================================== */
:root {
  /* ---- Space scale (8px base; 2/4 for fine control) ---- */
  --space-0: 0;
  --space-1: 0.25rem;   /* 4 */
  --space-2: 0.5rem;    /* 8 */
  --space-3: 0.75rem;   /* 12 */
  --space-4: 1rem;      /* 16 */
  --space-5: 1.5rem;    /* 24 */
  --space-6: 2rem;      /* 32 */
  --space-7: 2.5rem;    /* 40 */
  --space-8: 3rem;      /* 48 */
  --space-9: 4rem;      /* 64 */
  --space-10: 5rem;     /* 80 */
  --space-12: 6rem;     /* 96 */

  /* ---- Radii (tight, corporate) ---- */
  --radius-xs: 3px;
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-pill: 999px;

  /* ---- Border widths ---- */
  --border-hair: 1px;
  --border-thin: 1.5px;
  --border-thick: 2px;
  --border-accent: 3px;   /* left-rule accents on stat blocks */

  /* ---- Container widths ---- */
  --container-sm: 640px;
  --container-md: 880px;
  --container-lg: 1120px;
  --container-xl: 1280px;

  /* ---- Control sizing ---- */
  --control-h-sm: 32px;
  --control-h-md: 40px;
  --control-h-lg: 48px;
  --tap-min: 44px;
}
/* ==========================================================================
   NCGCL — Elevation, shadow, focus, motion tokens
   Soft, cool-tinted shadows (petrol, never pure black). Calm, brief motion —
   an institution that moves with intent, not flourish.
   ========================================================================== */
:root {
  /* ---- Shadows (cool petrol tint) ---- */
  --shadow-xs: 0 1px 2px rgba(6, 22, 38, 0.06);
  --shadow-sm: 0 1px 3px rgba(6, 22, 38, 0.08), 0 1px 2px rgba(6, 22, 38, 0.04);
  --shadow-md: 0 4px 12px rgba(6, 22, 38, 0.08), 0 2px 4px rgba(6, 22, 38, 0.05);
  --shadow-lg: 0 12px 28px rgba(6, 22, 38, 0.12), 0 4px 8px rgba(6, 22, 38, 0.06);
  --shadow-xl: 0 24px 48px rgba(6, 22, 38, 0.16);

  /* ---- Inner / inset ---- */
  --shadow-inset: inset 0 1px 2px rgba(6, 22, 38, 0.08);

  /* ---- Focus ring ---- */
  --focus-ring-width: 3px;
  --focus-ring-color: rgba(0, 122, 160, 0.45);
  --focus-ring-shadow: 0 0 0 var(--focus-ring-width) var(--focus-ring-color);

  /* ---- Motion ---- */
  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */
  --duration-fast: 120ms; /* @kind other */
  --duration-base: 200ms; /* @kind other */
  --duration-slow: 320ms; /* @kind other */
}

<div id="root"></div>
<script type="text/babel">
// NCGCL — People & Organizational Capacity · FY2026 Shareholder Briefing
const { Card, Badge, Tag, StatBlock, DataTable, ProgressMeter, Callout, Logo } = window.NCGCLDesignSystem_07e4b6;

function Eyebrow({ children, tone = "primary" }) {
  const c = tone === "green" ? "var(--color-accent)" : "var(--color-primary)";
  return (
    <div style={{ fontSize: "var(--text-2xs)", fontWeight: "var(--weight-bold)", textTransform: "uppercase",
      letterSpacing: "var(--tracking-eyebrow)", color: c, marginBottom: "8px" }}>{children}</div>
  );
}

function SectionHead({ kicker, title, sub, tone }) {
  const c = tone === "green" ? "var(--color-accent)" : "var(--color-primary)";
  return (
    <div style={{ marginBottom: "20px" }}>
      <div style={{ fontSize: "var(--text-2xs)", fontWeight: "var(--weight-bold)", textTransform: "uppercase",
        letterSpacing: "var(--tracking-eyebrow)", color: c, marginBottom: "6px" }}>{kicker}</div>
      <h2 style={{ margin: 0, fontSize: "var(--text-h4)", fontWeight: "var(--weight-bold)",
        letterSpacing: "var(--tracking-tight)", color: "var(--text-strong)" }}
        dangerouslySetInnerHTML={{ __html: title }} />
      {sub && <div style={{ marginTop: "6px", fontSize: "var(--text-sm)", color: "var(--text-muted)",
        maxWidth: "80ch", lineHeight: "var(--leading-normal)" }}>{sub}</div>}
    </div>
  );
}

function Divider() {
  return <div style={{ height: 1, background: "var(--border-subtle)", margin: "44px 0" }} />;
}

function MiniStat({ value, label, tone = "primary" }) {
  const c = tone === "green" ? "var(--color-accent)" : tone === "muted" ? "var(--text-muted)" : "var(--color-primary)";
  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: "var(--text-h5)", fontWeight: "var(--weight-semibold)", color: c }}>{value}</div>
      <div style={{ fontSize: "var(--text-2xs)", color: "var(--text-on-dark-muted)", textTransform: "uppercase",
        letterSpacing: "var(--tracking-eyebrow)", marginTop: "4px" }}>{label}</div>
    </div>
  );
}

function FlowNode({ title, sub, color }) {
  return (
    <div style={{ background: "var(--surface-card)", border: "var(--border-hair) solid var(--border-subtle)",
      borderTop: `3px solid ${color}`, borderRadius: "var(--radius-md)", padding: "14px 16px", flex: "1 1 0", minWidth: 150 }}>
      <div style={{ fontSize: "var(--text-sm)", fontWeight: "var(--weight-bold)", color: "var(--text-strong)", marginBottom: 4 }}>{title}</div>
      <div style={{ fontSize: "var(--text-xs)", color: "var(--text-muted)", lineHeight: 1.5 }}>{sub}</div>
    </div>
  );
}

    { t1: "Head — Products",      caption: "Origination · FI Partnerships",     cxo: true  },
    { t1: "Head — Research",      caption: "Sector Studies · Data Analytics",   cxo: true  },
    { t1: "Company Secretary", t2: "& Head, Gov Relations", caption: "Governance · Regulatory",        cxo: false },
    { t1: "Manager,",         t2: "Operations",             caption: "Ops · Process · GMS",            cxo: false },
    { t1: "Manager, HR",          caption: "People · Payroll · Culture",        cxo: false },
    { t1: "Head of Credit",   t2: "Administration",         caption: "Docs · Disbursement",            cxo: false },
  ];

  // L3 only under first 4 strategic heads
  const L3nodes = [
    { label: "Finance Analyst",    pi: 0 },
    { label: "Guarantee Analyst",  pi: 1 },
    { label: "Product Analyst",    pi: 2 },
    { label: "Research Analyst",   pi: 3 },
  ];

  return (
    <svg viewBox={`0 0 ${VW} ${VH}`} xmlns="http://www.w3.org/2000/svg"
         style={{ width: "100%", height: "auto", display: "block" }}>

      {/* ── Wiring ── */}
      {/* CEO drop to rail */}
      <line x1={ceoX} y1={ceoY+24} x2={ceoX} y2={railY}
            stroke="#A7C7D6" strokeWidth="1.5" strokeDasharray="4 3"/>
      {/* Horizontal rail spanning all 8 boxes */}
      <line x1={cxOf(0)} y1={railY} x2={cxOf(7)} y2={railY}
            stroke="#A7C7D6" strokeWidth="1.5" strokeDasharray="4 3"/>
      {/* Drops from rail to each L2 box top */}
      {L2nodes.map((_,i) => (
        <line key={i} x1={cxOf(i)} y1={railY} x2={cxOf(i)} y2={L2Y - bh/2}
              stroke="#A7C7D6" strokeWidth="1.5" strokeDasharray="4 3"/>
      ))}
      {/* L2 → L3 (first 4 only) */}
      {L3nodes.map((n,i) => (
        <line key={i} x1={cxOf(n.pi)} y1={L2Y + bh/2} x2={cxOf(n.pi)} y2={L3Y - l3bh/2}
              stroke="#C8D6E0" strokeWidth="1.2" strokeDasharray="3 3"/>
      ))}

      {/* ── Subtle group separator between pos 3 and 4 ── */}
      <line x1={(cxOf(3)+cxOf(4))/2} y1={L2Y - bh/2 - 10}
            x2={(cxOf(3)+cxOf(4))/2} y2={L2Y + bh/2 + 10}
            stroke="#C8D6E0" strokeWidth="1" strokeDasharray="3 2"/>

      {/* ── CEO node ── */}
      <rect x={ceoX - 68} y={ceoY - 24} width={136} height={48} rx="6" fill="#042B3B"/>
      <text x={ceoX} y={ceoY - 4} textAnchor="middle" fontFamily={FF} fontSize="13" fontWeight="800" fill="#fff">CEO</text>
      <text x={ceoX} y={ceoY + 14} textAnchor="middle" fontFamily={FF} fontSize="9" fill="#A7C7D6">Strategy · Capital · External</text>

      {/* ── L2 nodes ── */}
      {L2nodes.map((n, i) => {
        const cx = cxOf(i);
        const fill = n.cxo ? "#004C66" : "#0C688D";
        const hasTwoTitle = !!n.t2;
        return (
          <g key={i}>
            <rect x={cx - bw/2} y={L2Y - bh/2} width={bw} height={bh} rx="5" fill={fill}/>
            {hasTwoTitle ? (
              <>
                <text x={cx} y={L2Y - 9} textAnchor="middle" fontFamily={FF} fontSize="9.5" fontWeight="700" fill="#fff">{n.t1}</text>
                <text x={cx} y={L2Y + 5} textAnchor="middle" fontFamily={FF} fontSize="9.5" fontWeight="700" fill="#fff">{n.t2}</text>
                <text x={cx} y={L2Y + 21} textAnchor="middle" fontFamily={FF} fontSize="7.5" fill="#A7C7D6">{n.caption}</text>
              </>
            ) : (
              <>
                <text x={cx} y={L2Y + 2} textAnchor="middle" fontFamily={FF} fontSize="9.5" fontWeight="700" fill="#fff">{n.t1}</text>
                <text x={cx} y={L2Y + 18} textAnchor="middle" fontFamily={FF} fontSize="7.5" fill="#A7C7D6">{n.caption}</text>
              </>
            )}
          </g>
        );
      })}

      {/* ── L3 nodes (strategic heads only) ── */}
      {L3nodes.map((n, i) => {
        const cx = cxOf(n.pi);
        return (
          <g key={i}>
            <rect x={cx - 57} y={L3Y - l3bh/2} width={114} height={l3bh} rx="5"
                  fill="#E3EEF3" stroke="#A7C7D6" strokeWidth="1"/>
            <text x={cx} y={L3Y + 5} textAnchor="middle" fontFamily={FF} fontSize="10" fontWeight="600" fill="#035076">{n.label}</text>
          </g>
        );
      })}

      {/* ── Layer labels ── */}
      <text x="18" y={ceoY + 6} fontFamily={FF} fontSize="9" fontWeight="700" letterSpacing="1.5" fill="#7F7F7F">L1</text>
      <text x="18" y={L2Y + 6} fontFamily={FF} fontSize="9" fontWeight="700" letterSpacing="1.5" fill="#7F7F7F">L2</text>
      <text x="18" y={L3Y + 6} fontFamily={FF} fontSize="9" fontWeight="700" letterSpacing="1.5" fill="#7F7F7F">L3</text>

      {/* ── Group captions ── */}
      <text x={(cxOf(0)+cxOf(3))/2} y={VH - 18} textAnchor="middle" fontFamily={FF} fontSize="9" fontWeight="600" fill="#5B6B7A">Strategic leadership</text>
      <text x={(cxOf(4)+cxOf(7))/2} y={VH - 18} textAnchor="middle" fontFamily={FF} fontSize="9" fontWeight="600" fill="#5B6B7A">Operational functions</text>

      {/* ── Bottom annotation ── */}
      <text x={VW/2} y={VH - 4} textAnchor="middle" fontFamily={FF} fontSize="9" fontStyle="italic" fill="#AEAEAE">
        All 8 roles are direct reports to CEO · 3 layers maximum · squad rotation collapses functional distance in practice
      </text>
    </svg>
  );
}

// ── GMS Build Cost Comparison ────────────────────────────────────────────────
function GMSCostBar() {
  const FF = "Figtree, system-ui, sans-serif";
  // Vendor bar: full width 500px.  NCGCL bar: ~140px (~28%) — reflects fraction of vendor cost.
  // Savings callout spans from NCGCL bar right-edge to vendor bar right-edge.
  const VX = 80, VEND = 580; // vendor bar: x=80, right-edge=580 (width=500)
  const GW = 140;             // NCGCL GMS bar width
  const GEND = VX + GW;       // 220 — right edge of NCGCL bar
  const midSave = (GEND + VEND) / 2; // 400 — center of savings callout
  return (
    <svg viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" style={{ width: "100%", height: "auto", display: "block" }}>

      {/* ── Vendor bar ── */}
      <rect x={VX} y="18" width="500" height="40" rx="5" fill="#E3EEF3" stroke="#A7C7D6" strokeWidth="1"/>
      <rect x={VX} y="18" width="500" height="40" rx="5" fill="#0C688D" opacity="0.12"/>
      <text x={VX+10} y="43" fontFamily={FF} fontSize="11" fontWeight="700" fill="#004C66">Traditional vendor / consultant route</text>
      <text x={VEND-8} y="43" fontFamily={FF} fontSize="11" fontWeight="700" fill="#004C66" textAnchor="end">PKR 30–60M+</text>
      <text x={VX+10} y="56" fontFamily={FF} fontSize="9" fill="#5B6B7A">18–24 month implementation · over-engineered · annual licence fees · vendor lock-in</text>

      {/* ── NCGCL GMS bar ── */}
      <rect x={VX} y="80" width={GW} height="40" rx="5" fill="#E6F4E2" stroke="#39A935" strokeWidth="1.8"/>
      <text x={VX + GW/2} y="102" textAnchor="middle" fontFamily={FF} fontSize="11" fontWeight="700" fill="#1F6A1D">NCGCL GMS</text>
      <text x={VX + GW/2} y="116" textAnchor="middle" fontFamily={FF} fontSize="9" fontWeight="600" fill="#2B8129">In-house build</text>

      {/* ── Savings span line ── */}
      <line x1={GEND + 6} y1="100" x2={VEND - 6} y2="100"
            stroke="#A7C7D6" strokeWidth="1" strokeDasharray="4 3"/>
      <line x1={GEND + 6} y1="93" x2={GEND + 6} y2="107" stroke="#A7C7D6" strokeWidth="1"/>
      <line x1={VEND - 6} y1="93" x2={VEND - 6} y2="107" stroke="#A7C7D6" strokeWidth="1"/>

      {/* ── Savings callout badge ── */}
      <rect x={midSave - 66} y="87" width="132" height="26" rx="5" fill="#042B3B"/>
      <text x={midSave} y="105" textAnchor="middle" fontFamily={FF} fontSize="10.5" fontWeight="700" fill="#fff">Significant savings</text>

      {/* ── NCGCL caption (below bar, not inside it) ── */}
      <text x={VX} y="138" fontFamily={FF} fontSize="9" fill="#2B8129">
        Tactical dev engagement · in-house product spec · zero licence fee · NCGCL owns the codebase
      </text>

      {/* ── Fine print ── */}
      <text x={VX} y="158" fontFamily={FF} fontSize="9" fontStyle="italic" fill="#AEAEAE">
        Indicative comparison · actual figures confidential · capital saved reinvested into guarantee capacity
      </text>
    </svg>
  );
}
