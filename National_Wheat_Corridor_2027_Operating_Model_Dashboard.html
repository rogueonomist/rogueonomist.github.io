<meta charset="UTF-8"/>
<title>National Wheat Corridor — 2027 Operating Model</title>
<style>
:root{
  --ncgcl-blue:#0C688D; --ncgcl-green:#39A935;
  --petrol-900:#042B3B; --petrol-800:#004C66; --petrol-700:#035076; --petrol-600:#0C688D;
  --petrol-500:#12678A; --petrol-400:#007AA0; --petrol-300:#4FA0BC; --petrol-200:#A7C7D6; --petrol-100:#E3EEF3;
  --green-800:#1F6A1D; --green-700:#2B8129; --green-600:#39A935; --green-500:#4EA72E; --green-400:#5AB060; --green-300:#8CD872; --green-100:#E6F4E2;
  --ink-900:#061626; --ink-800:#0E2841; --ink-700:#1E293B; --ink-600:#33424F;
  --slate-500:#5B6B7A; --slate-400:#7F7F7F; --slate-300:#AEAEAE; --slate-200:#C8D6E0; --slate-150:#E2E8F0; --slate-100:#EEF1F4; --slate-50:#F6F8FA;
  --risk-high:#C00000; --risk-med:#BF9000; --risk-low:#2B8129;

  --bg-page: var(--slate-50);
  --bg-canvas: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-muted: var(--slate-100);
  --bg-sunken: var(--slate-100);
  --bg-input: #FFFFFF;
  --text-strong: var(--ink-800);
  --text-body: #1F2E3A;
  --text-muted: var(--slate-500);
  --text-faint: var(--slate-300);
  --text-on-accent:#FFFFFF;
  --border-subtle: var(--slate-200);
  --border-strong:#9FB5C4;
  --shadow-sm: 0 1px 3px rgba(6,22,38,.08), 0 1px 2px rgba(6,22,38,.04);
  --shadow-md: 0 4px 12px rgba(6,22,38,.08), 0 2px 4px rgba(6,22,38,.05);
  --grid-line: rgba(51,66,79,.12);
  --chart-surface: #FFFFFF;
  --seq-1:#E3EEF3; --seq-2:#A7C7D6; --seq-3:#4FA0BC; --seq-4:#12678A; --seq-5:#035076; --seq-6:#042B3B;
  --cat-1:#0C688D; --cat-2:#39A935; --cat-3:#4FA0BC; --cat-4:#8CD872; --cat-5:#5B6B7A;
  --font-sans: "Figtree","Google Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg-page:#03141F; --bg-canvas: var(--petrol-900); --bg-card:#06222F; --bg-muted:#0A2C3B; --bg-sunken:#052029; --bg-input:#06222F;
  --text-strong:#F3F7FA; --text-body:#DCE6EC; --text-muted:#8FA9B8; --text-faint:#5B7889;
  --border-subtle: rgba(167,199,214,.18); --border-strong: rgba(167,199,214,.32);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.35); --shadow-md: 0 6px 20px rgba(0,0,0,.45);
  --grid-line: rgba(167,199,214,.14); --chart-surface:#06222F;
  --seq-1:#0A2C3B; --seq-2:#0F425A; --seq-3:#4FA0BC; --seq-4:#6FC1DE; --seq-5:#9AD8EE; --seq-6:#CFEFF9;
  --cat-1:#4FA0BC; --cat-2:#5AB060; --cat-3:#A7C7D6; --cat-4:#8CD872; --cat-5:#8FA9B8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-page:#03141F; --bg-canvas: var(--petrol-900); --bg-card:#06222F; --bg-muted:#0A2C3B; --bg-sunken:#052029; --bg-input:#06222F;
    --text-strong:#F3F7FA; --text-body:#DCE6EC; --text-muted:#8FA9B8; --text-faint:#5B7889;
    --border-subtle: rgba(167,199,214,.18); --border-strong: rgba(167,199,214,.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.35); --shadow-md: 0 6px 20px rgba(0,0,0,.45);
    --grid-line: rgba(167,199,214,.14); --chart-surface:#06222F;
    --seq-1:#0A2C3B; --seq-2:#0F425A; --seq-3:#4FA0BC; --seq-4:#6FC1DE; --seq-5:#9AD8EE; --seq-6:#CFEFF9;
    --cat-1:#4FA0BC; --cat-2:#5AB060; --cat-3:#A7C7D6; --cat-4:#8CD872; --cat-5:#8FA9B8;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-page); color:var(--text-body); font-family:var(--font-sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tabular{ font-variant-numeric:tabular-nums; }
.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
h1,h2,h3,h4{ font-family:var(--font-sans); color:var(--text-strong); margin:0; text-wrap:balance; letter-spacing:-0.01em; }
a{color:var(--petrol-400);}
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--petrol-400); }
:root[data-theme="dark"] .eyebrow, @media (prefers-color-scheme:dark){ .eyebrow{color:var(--seq-4);} }
button{ font-family:inherit; cursor:pointer; }
input,select{ font-family:inherit; }
::selection{ background:var(--ncgcl-green); color:#fff; }

.shell{ max-width:1320px; margin:0 auto; padding:0 28px 80px; }

/* ---------- Header ---------- */
.topbar{ background:var(--petrol-900); color:#fff; }
.topbar-inner{ max-width:1320px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; gap:16px; }
.logo-mark{ width:38px; height:38px; border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; flex:none; padding:5px;}
.logo-mark img{ width:100%; height:100%; object-fit:contain; }
.brand-title{ font-size:15px; font-weight:700; letter-spacing:.01em; color:#fff; }
.brand-sub{ font-size:11.5px; color:var(--petrol-200); letter-spacing:.05em; text-transform:uppercase; margin-top:1px;}
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; padding:5px 10px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
.chip-outline-dark{ border-color:rgba(255,255,255,.28); color:#fff; }
.chip-green{ background:var(--green-100); color:var(--green-800); }
.chip-red{ background:#FCE8E8; color:var(--risk-high); }
.chip-amber{ background:#FBF3DC; color:#7A5E00; }
.chip-blue{ background:var(--petrol-100); color:var(--petrol-700); }
.chip-grey{ background:var(--slate-100); color:var(--slate-500); }
:root[data-theme="dark"] .chip-green, @media (prefers-color-scheme:dark){.chip-green{background:rgba(57,169,53,.18); color:#8CD872;}}
:root[data-theme="dark"] .chip-red, @media (prefers-color-scheme:dark){.chip-red{background:rgba(192,0,0,.2); color:#FF8A8A;}}
:root[data-theme="dark"] .chip-amber, @media (prefers-color-scheme:dark){.chip-amber{background:rgba(191,144,0,.2); color:#F0CD5A;}}
:root[data-theme="dark"] .chip-blue, @media (prefers-color-scheme:dark){.chip-blue{background:rgba(79,160,188,.18); color:#9AD8EE;}}
:root[data-theme="dark"] .chip-grey, @media (prefers-color-scheme:dark){.chip-grey{background:rgba(167,199,214,.14); color:#8FA9B8;}}

.theme-toggle{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); color:#fff; border-radius:7px; padding:6px 9px; display:flex; align-items:center; }
.theme-toggle:hover{ background:rgba(255,255,255,.16); }

.hero{ padding:26px 0 8px; }
.hero-thesis{ font-size:20px; line-height:1.4; color:var(--text-strong); max-width:920px; font-weight:500; }
.hero-thesis b{ color:var(--petrol-500); font-weight:700; }
:root[data-theme="dark"] .hero-thesis b, @media (prefers-color-scheme:dark){.hero-thesis b{color:var(--seq-4);}}
.hero-meta{ margin-top:10px; display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--text-muted); }
.hero-meta span{ display:flex; align-items:center; gap:6px; }

/* ---------- Control strip ---------- */
.control-strip{ position:sticky; top:0; z-index:40; background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:12px; box-shadow:var(--shadow-md); padding:14px 18px; margin:18px 0 26px; }
.control-strip-inner{ display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; }
.ctrl-group{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.ctrl-label{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); white-space:nowrap; }
.segmented{ display:flex; border:1px solid var(--border-subtle); border-radius:8px; overflow:hidden; background:var(--bg-sunken); }
.segmented button{ border:none; background:transparent; padding:7px 13px; font-size:12.5px; font-weight:600; color:var(--text-muted); border-right:1px solid var(--border-subtle); }
.segmented button:last-child{ border-right:none; }
.segmented button.active{ background:var(--petrol-600); color:#fff; }
.field-num{ width:110px; border:1px solid var(--border-subtle); background:var(--bg-input); border-radius:7px; padding:7px 9px; font-size:13px; color:var(--text-strong); font-family:var(--font-mono); }
.field-num:focus, select:focus, input:focus{ outline:none; box-shadow:0 0 0 3px rgba(0,122,160,.28); border-color:var(--petrol-400); }
.slider-wrap{ display:flex; align-items:center; gap:10px; }
input[type=range]{ width:150px; accent-color:var(--petrol-600); }
.slider-val{ font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--petrol-600); width:56px; }
:root[data-theme="dark"] .slider-val, @media (prefers-color-scheme:dark){.slider-val{color:var(--seq-5);}}
.reset-btn{ margin-left:auto; background:transparent; border:1px solid var(--border-subtle); color:var(--text-muted); font-size:12px; font-weight:600; border-radius:7px; padding:8px 12px; display:flex; align-items:center; gap:6px; }
.reset-btn:hover{ border-color:var(--petrol-400); color:var(--petrol-500); }

/* ---------- Nav ---------- */
.section-nav{ position:sticky; top:78px; z-index:35; display:flex; gap:4px; overflow-x:auto; padding:6px; background:var(--bg-muted); border-radius:11px; margin-bottom:26px; border:1px solid var(--border-subtle); }
.section-nav button{ flex:none; background:transparent; border:none; padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--text-muted); border-radius:8px; white-space:nowrap; }
.section-nav button.active{ background:var(--bg-card); color:var(--petrol-600); box-shadow:var(--shadow-sm); }
:root[data-theme="dark"] .section-nav button.active, @media (prefers-color-scheme:dark){ .section-nav button.active{ color:var(--seq-5);} }

/* ---------- Sections / Cards ---------- */
.view{ display:none; }
.view.active{ display:block; animation:fadein .2s var(--ease,ease-out); }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
@media (prefers-reduced-motion:reduce){ .view.active{animation:none;} }

.section-head{ margin-bottom:18px; }
.section-head h2{ font-size:22px; font-weight:700; margin-bottom:6px; }
.section-head p{ margin:0; color:var(--text-muted); font-size:13.5px; max-width:820px; line-height:1.55; }

.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns:1fr 1fr; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-5{ grid-template-columns:repeat(5,1fr); }
@media (max-width:980px){ .grid-2,.grid-3,.grid-4,.grid-5{ grid-template-columns:1fr; } }

.card{ background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:11px; box-shadow:var(--shadow-sm); padding:18px 20px; }
.card-title{ font-size:13px; font-weight:700; color:var(--text-strong); margin-bottom:2px; }
.card-sub{ font-size:11.5px; color:var(--text-muted); margin-bottom:14px; }
.card-accent-top{ border-top:3px solid var(--petrol-600); }
.card-accent-top.green{ border-top-color:var(--ncgcl-green); }

.stat-tile{ background:var(--bg-card); border:1px solid var(--border-subtle); border-left:3px solid var(--petrol-600); border-radius:9px; padding:14px 16px; box-shadow:var(--shadow-sm); }
.stat-tile.accent-green{ border-left-color:var(--ncgcl-green); }
.stat-tile.accent-red{ border-left-color:var(--risk-high); }
.stat-tile.accent-amber{ border-left-color:var(--risk-med); }
.stat-label{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:7px; }
.stat-value{ font-family:var(--font-mono); font-size:25px; font-weight:600; color:var(--text-strong); line-height:1.1; }
.stat-value small{ font-size:13px; font-weight:500; color:var(--text-muted); margin-left:2px;}
.stat-foot{ font-size:11.5px; color:var(--text-muted); margin-top:6px; }

table{ width:100%; border-collapse:collapse; font-size:12.8px; }
th{ text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); padding:8px 10px; border-bottom:1px solid var(--border-subtle); white-space:nowrap; }
td{ padding:8px 10px; border-bottom:1px solid var(--border-subtle); color:var(--text-body); white-space:nowrap; }
tr:last-child td{ border-bottom:none; }
td.num, th.num{ text-align:right; font-family:var(--font-mono); }
.table-wrap{ overflow-x:auto; border-radius:8px; }
tbody tr:hover{ background:var(--bg-sunken); }
.row-strong td{ font-weight:700; color:var(--text-strong); background:var(--bg-sunken); }

.callout{ border-radius:10px; padding:14px 16px; font-size:13px; line-height:1.55; border:1px solid; display:flex; gap:10px; }
.callout-impact{ background:var(--petrol-100); border-color:var(--petrol-200); color:var(--petrol-800); }
.callout-action{ background:var(--green-100); border-color:#BFE3B8; color:var(--green-800); }
:root[data-theme="dark"] .callout-impact, @media (prefers-color-scheme:dark){.callout-impact{background:rgba(79,160,188,.12); border-color:rgba(79,160,188,.3); color:#CFEFF9;}}
:root[data-theme="dark"] .callout-action, @media (prefers-color-scheme:dark){.callout-action{background:rgba(57,169,53,.12); border-color:rgba(57,169,53,.32); color:#B7E6AE;}}
.callout b{ display:block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px; }

.form-row{ display:flex; flex-direction:column; gap:5px; }
.form-row label{ font-size:11.5px; font-weight:600; color:var(--text-muted); }
.form-row input, .form-row select{ border:1px solid var(--border-subtle); background:var(--bg-input); border-radius:7px; padding:8px 10px; font-size:13px; color:var(--text-strong); font-family:var(--font-mono); }

.divider{ height:1px; background:var(--border-subtle); margin:22px 0; border:none; }

.legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); margin-top:8px; }
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; }
.legend i.line{ width:16px; height:2px; border-radius:1px; }

.chart-tooltip{ position:absolute; pointer-events:none; background:var(--ink-900); color:#fff; font-size:11.5px; padding:7px 10px; border-radius:7px; box-shadow:var(--shadow-md); z-index:50; white-space:nowrap; opacity:0; transition:opacity .1s; font-family:var(--font-mono); }
.chart-tooltip b{ font-family:var(--font-sans); display:block; margin-bottom:2px; font-weight:700; }
.chart-wrap{ position:relative; }
.axis-label{ font-size:9.5px; fill:var(--text-faint); font-family:var(--font-sans); }
.grid-line{ stroke:var(--grid-line); stroke-width:1; }

footer.chrome{ text-align:center; padding:26px 28px; font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--border-subtle); margin-top:40px; }

.icon{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.badge-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }

.two-col{ display:grid; grid-template-columns:340px 1fr; gap:18px; }
@media (max-width:980px){ .two-col{ grid-template-columns:1fr; } }

.kv{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border-subtle); font-size:12.8px; }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--text-muted); }
.kv .v{ font-family:var(--font-mono); font-weight:600; color:var(--text-strong); }

.pillbar{ display:flex; height:8px; border-radius:5px; overflow:hidden; background:var(--bg-sunken); }
.pillbar div{ height:100%; }

.gate-ladder{ position:relative; height:64px; margin:18px 0 8px; }
.gate-track{ position:absolute; top:26px; left:0; right:0; height:12px; border-radius:6px; overflow:hidden; display:flex; }
.gate-marker{ position:absolute; top:6px; width:2px; height:52px; background:var(--ink-800); }
:root[data-theme="dark"] .gate-marker, @media (prefers-color-scheme:dark){ .gate-marker{background:#fff;} }
.gate-marker .flag{ position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-size:11px; font-weight:700; white-space:nowrap; color:var(--text-strong); }
.gate-labels{ position:absolute; top:42px; left:0; right:0; height:20px; }
.gate-labels span{ position:absolute; font-size:10px; color:var(--text-muted); transform:translateX(-50%); white-space:nowrap; font-family:var(--font-mono); }

.range-input-row{ display:flex; align-items:center; gap:10px; }
.range-input-row input[type=range]{ flex:1; width:auto; }
</style>

/* ---------------------------- compute engine ---------------------------- */
function round100(x){ return Math.round(x/100)*100; }
function fmt(x,d=0){ if(x===undefined||x===null||isNaN(x)) return '—'; return Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }

/* Granular cost-of-production build-up — mirrors Pakistan_Wheat_Cost_of_Production_Calculator_Knowledge_File.md
   (API Wheat Policy Analysis 2023-24, Punjab) §5, §17, §23. COP is an OUTPUT of these components, not an input. */
function computeCOP(cop){
  const landPrep = cop.landPrep.rotavatorOps*cop.landPrep.rotavatorRate + cop.landPrep.ploughOps*cop.landPrep.ploughRate + cop.landPrep.laserOps*cop.landPrep.laserRate;
  const seed = cop.seed.seedKg*cop.seed.seedPrice + cop.seed.broadcastQty*cop.seed.broadcastRate + cop.seed.ploughAfterOps*cop.seed.ploughAfterRate + cop.seed.plankAfterOps*cop.seed.plankAfterRate + cop.seed.bundManualQty*cop.seed.bundManualRate + cop.seed.bundTractorHrs*cop.seed.bundTractorRate;
  const protection = cop.protection;
  const irrigation = cop.irrigation.canalCharge + cop.irrigation.tubewellCount*cop.irrigation.tubewellRate + cop.irrigation.labourWCC;
  const fertilizer = cop.fertilizer.fymQty*cop.fertilizer.fymRate + cop.fertilizer.dapBags*cop.fertilizer.dapRate + cop.fertilizer.ureaBags*cop.fertilizer.ureaRate + cop.fertilizer.npBags*cop.fertilizer.npRate + cop.fertilizer.canBags*cop.fertilizer.canRate + cop.fertilizer.transportApp;
  const harvest = cop.harvest.harvestUnits*cop.harvest.harvestRate + cop.harvest.threshUnits*cop.harvest.threshRate;
  const landRent = cop.landRent.annualRent*cop.landRent.wheatFraction;
  const management = cop.management, landTax = cop.landTax, financeMarkup = cop.financeMarkup;
  const grossCost = landPrep+seed+protection+irrigation+fertilizer+harvest+landRent+management+landTax+financeMarkup;
  const strawCredit = cop.strawValue;
  const netCost = grossCost - strawCredit;
  const netCostExFinance = netCost - financeMarkup;
  const marketingPerAcre = cop.marketingPer40kg * cop.yieldMaunds;
  const farmGateCOP = netCost / cop.yieldMaunds;
  const deliveredCOP = farmGateCOP + cop.marketingPer40kg;
  const deliveredCOPExLand = (netCost-landRent)/cop.yieldMaunds + cop.marketingPer40kg;
  const preFinanceDeliveredPerAcre = netCostExFinance + marketingPerAcre;
  return { landPrep, seed, protection, irrigation, fertilizer, harvest, landRent, management, landTax, financeMarkup,
    grossCost, strawCredit, netCost, netCostExFinance, marketingPerAcre, farmGateCOP, deliveredCOP, deliveredCOPExLand,
    preFinanceDeliveredPerAcre, yieldMaunds: cop.yieldMaunds, marketingPer40kg: cop.marketingPer40kg };
}

function computeFVA(deliveredCOP, s){
  const fvaRaw = deliveredCOP * (1 + s.normalReturn);
  return { fvaRaw, fva: round100(fvaRaw) };
}

function computeCorridor(s, fva){
  const months = [];
  const flour = computeFlourParams(s);
  for(let m=0;m<=12;m++){
    const centre = fva * (1 + s.assemblyMargin + m*(s.financeRate+s.storageRate+s.lossRate)/12);
    const lower = centre*(1-s.bandHalfWidth);
    const upper = centre*(1+s.bandHalfWidth);
    const centreKg = centre/s.kgPerUnit, lowerKg = lower/s.kgPerUnit, upperKg = upper/s.kgPerUnit;
    months.push({ m, centre, lower, upper, centreKg, lowerKg, upperKg,
      fairCeiling: centreKg*flour.fairCeiling, releaseTrigger: centreKg*flour.releaseBoundary });
  }
  return months;
}

function computeFlourParams(s){
  const outputCoef = s.attaYield + s.maidaYield*s.maidaMultiple;
  const Rstar = (1 + s.processingCost - s.branYield*s.branMultiple) / outputCoef;
  const fairCeiling = Rstar + s.fairCeilingAdd;
  const releaseBoundary = Math.max(Rstar + s.releaseBoundaryAdd, (1+s.processingCost+s.targetNetSpread-s.branYield*s.branMultiple)/outputCoef);
  const yieldSum = s.attaYield + s.maidaYield + s.branYield;
  return { outputCoef, Rstar, fairCeiling, releaseBoundary, yieldSum };
}

function computeFlour(s){
  const p = computeFlourParams(s);
  const observedRatio = s.attaPrice / s.millGateWheat;
  const netSpread = observedRatio*p.outputCoef + s.branYield*s.branMultiple - 1 - s.processingCost;
  const ratioBreach = observedRatio > p.releaseBoundary;
  const spreadBreach = netSpread >= s.targetNetSpread;
  const persistenceOK = s.flourBreachDays >= s.flourPersistenceDays;
  const trigger = ratioBreach && spreadBreach && persistenceOK;
  return { ...p, observedRatio, netSpread, ratioBreach, spreadBreach, persistenceOK, trigger };
}

function priceStatusAtMonth(s, corridorArr, m){
  const c = corridorArr[m];
  if(s.observedPrice > c.upper) return 'Above upper';
  if(s.observedPrice < c.lower) return 'Below lower';
  return 'Inside band';
}
function pricePersistence(s, status){
  if(status==='Above upper') return s.daysAboveUpper;
  if(status==='Below lower') return s.daysBelowLower;
  return 0;
}

function computeCase(s, caseKey, status, persistence){
  const c = s.cases[caseKey];
  const preTradeEnding = c.opening + c.production - c.use - c.external;
  const weeklyUse = c.use / s.weeksPerYear;
  const coverWeeks = preTradeEnding / weeklyUse;
  const importReq = Math.max(0, s.replenishmentWeeks*weeklyUse - preTradeEnding);
  const exportCeil = Math.max(0, preTradeEnding - s.postExportFloorWeeks*weeklyUse);
  let action, note;
  if(coverWeeks < s.emergencyImportGateWeeks){
    action = 'Emergency import to 10 weeks'; note = '0.25–0.50 MMT tranches; arrival blackout applies';
  } else if(status==='Above upper' && persistence>=10 && coverWeeks < s.normalImportGateWeeks){
    action = 'Import tranche toward 10 weeks'; note = '0.25–0.50 MMT tranches; arrival blackout applies';
  } else if(status==='Below lower' && persistence>=10 && coverWeeks > s.exportGateWeeks){
    action = 'Export may be considered'; note = 'Post-export cover ≥12 weeks; deficit provinces ≥8 weeks';
  } else if(status==='Above upper'){
    action = 'Movement, rotating reserve and competition review'; note = 'No foreign trade from stock or price alone';
  } else if(status==='Below lower'){
    action = 'EWR finance, movement and farmer support'; note = 'No foreign trade from stock or price alone';
  } else {
    action = 'No price intervention'; note = 'No foreign trade from stock or price alone';
  }
  return { key:caseKey, ...c, preTradeEnding, weeklyUse, coverWeeks, importReq, exportCeil, action, note };
}

function computeReserve(s){
  const targetReserve = s.stressUse/s.weeksPerYear * s.reserveTargetWeeks;
  const emergencyCore = targetReserve * s.emergencyCoreShare;
  const rotatingTranche = targetReserve - emergencyCore;
  const reserveGap = Math.max(0, targetReserve - s.accessiblePublicReserve);
  return { targetReserve, emergencyCore, rotatingTranche, reserveGap };
}

function computeProvinces(s, selectedCase, corridorArr){
  const c = s.cases[selectedCase];
  const centreAtMonth = corridorArr[s.month].centre;
  return PROVINCES.map(p=>{
    const production = p.baseProduction/BASE_PRODUCTION_TOTAL * c.production;
    const use = p.popShare * c.use;
    const opening = p.popShare * c.opening;
    const external = p.popShare * c.external;
    const preTransferEnding = opening + production - use - external;
    const weeklyUse = use / s.weeksPerYear;
    const coverWeeks = Math.max(0,preTransferEnding)/weeklyUse;
    const needTo8 = Math.max(0, 8*weeklyUse - preTransferEnding);
    const surplusAbove10 = Math.max(0, preTransferEnding - 10*weeklyUse);
    const deliveredCentre = centreAtMonth + p.basis;
    const lower = deliveredCentre*(1-s.bandHalfWidth), upper = deliveredCentre*(1+s.bandHalfWidth);
    let reading;
    if(needTo8>0) reading='Receiver: quantify transfer need';
    else if(surplusAbove10>0) reading='Potential donor after safety stock';
    else reading='Balanced / monitor';
    return { ...p, production, use, opening, external, preTransferEnding, weeklyUse, coverWeeks, needTo8, surplusAbove10, deliveredCentre, lower, upper, reading };
  });
}

function computeMonthlyBalance(s, selectedCase, corridorArr){
  const c = s.cases[selectedCase];
  let opening = c.opening;
  const rows=[];
  for(let i=0;i<12;i++){
    const production = ARRIVAL_WEIGHTS[i]*c.production;
    const use = c.use/12, external = c.external/12;
    const ending = opening+production-use-external;
    const weeklyUse = use*12/s.weeksPerYear;
    const coverWeeks = ending/weeklyUse;
    const centre = corridorArr[i].centre;
    let status;
    if(coverWeeks < s.emergencyImportGateWeeks) status='Emergency cover';
    else if(coverWeeks < s.normalImportGateWeeks) status='Below normal import gate';
    else if(coverWeeks > s.exportGateWeeks) status='Above export-cover gate';
    else status='Normal cover';
    rows.push({ month:MONTH_LABELS[i], i, production, opening, use, external, ending, coverWeeks, centre, status });
    opening = ending;
  }
  return rows;
}

function financeCostFor(s, leverage, rate, base){ return (leverage*base) * rate * s.financingTenor/12; }
function breakEvenFor(s, leverage, rate, preFinanceCost, yieldMaunds){ return (preFinanceCost + financeCostFor(s,leverage,rate,s.tradedInputBase)) / yieldMaunds; }

function computeFarmerFinance(s, cop){
  const preFinanceCost = cop.preFinanceDeliveredPerAcre;
  const yieldMaunds = cop.yieldMaunds;
  const landRentPerAcre = cop.landRent;
  const leverageSteps=[0,0.25,0.5,0.75,1.0];
  const table = leverageSteps.map(lev=>{
    const row = {leverage:lev};
    RATE_OPTIONS.forEach(r=>{ row[r.key] = breakEvenFor(s, lev, r.rate, preFinanceCost, yieldMaunds); });
    return row;
  });
  const selRate = RATE_OPTIONS.find(r=>r.key===s.selectedFundingSource).rate;
  const financeCost = financeCostFor(s, s.leverage, selRate, s.tradedInputBase);
  const breakEven = (preFinanceCost + financeCost)/yieldMaunds;
  const economicProfit = s.grainPrice*yieldMaunds - preFinanceCost - financeCost;

  const ownerCashBase = preFinanceCost - landRentPerAcre;
  const ownerCashBE = (ownerCashBase+financeCost)/yieldMaunds;
  const ownerCashProfit = s.grainPrice*yieldMaunds - ownerCashBase - financeCost;

  const tenantDebtBase = s.tradedInputBase + landRentPerAcre*s.tenantRentDebtShare;
  const tenantDebtFinance = financeCostFor(s, s.leverage, selRate, tenantDebtBase);
  const tenantDebtBE = (preFinanceCost+tenantDebtFinance)/yieldMaunds;
  const tenantDebtProfit = s.grainPrice*yieldMaunds - preFinanceCost - tenantDebtFinance;

  return { table, financeCost, breakEven, economicProfit, preFinanceCost, yieldMaunds, landRentPerAcre,
    ownerCashBE, ownerCashProfit, ownerFullBE:breakEven, ownerFullProfit:economicProfit,
    tenantSelfBE:breakEven, tenantSelfProfit:economicProfit, tenantDebtBE, tenantDebtProfit };
}

function computeAll(s){
  const cop = computeCOP(s.cop);
  const { fva, fvaRaw } = computeFVA(cop.deliveredCOP, s);
  const corridor = computeCorridor(s, fva);
  const flour = computeFlour(s);
  const status = priceStatusAtMonth(s, corridor, s.month);
  const persistence = pricePersistence(s, status);
  const cases = { Tight: computeCase(s,'Tight',status,persistence), Base: computeCase(s,'Base',status,persistence), Surplus: computeCase(s,'Surplus',status,persistence), Custom: computeCase(s,'Custom',status,persistence) };
  const sel = cases[s.scenario];
  const reserve = computeReserve(s);
  const provinces = computeProvinces(s, s.scenario, corridor);
  const monthly = computeMonthlyBalance(s, s.scenario, corridor);
  const farmerFinance = computeFarmerFinance(s, cop);

  const normalImportGate = (status==='Above upper' && persistence>=10 && sel.coverWeeks < s.normalImportGateWeeks);
  const emergencyImportGate = sel.coverWeeks < s.emergencyImportGateWeeks;
  const exportGate = (status==='Below lower' && persistence>=10 && sel.coverWeeks > s.exportGateWeeks);
  const indicativeReleaseQty = flour.trigger ? Math.min(s.reserveAuctionMax, reserve.rotatingTranche) : 0;
  const reserveAfterRelease = s.accessiblePublicReserve - indicativeReleaseQty;

  return { cop, fva, fvaRaw, corridor, flour, status, persistence, cases, sel, reserve, provinces, monthly, farmerFinance,
    normalImportGate, emergencyImportGate, exportGate, indicativeReleaseQty, reserveAfterRelease, copGross: cop.grossCost };
}

/* ============================== SVG CHART ENGINE ============================== */
const NS='http://www.w3.org/2000/svg';
function svgEl(tag, attrs={}){ const el=document.createElementNS(NS,tag); for(const k in attrs) el.setAttribute(k,attrs[k]); return el; }
function niceStep(range, targetTicks){
  const raw = range/targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw/mag;
  let step = norm<1.5?1:norm<3?2:norm<7?5:10;
  return step*mag;
}
const tooltipEl = ()=>document.getElementById('tooltip');
function showTip(evt, html){
  const t = tooltipEl(); t.innerHTML = html; t.style.opacity=1;
  const pad=14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if(x + 220 > window.innerWidth) x = evt.clientX - 220;
  t.style.left = (x+window.scrollX)+'px'; t.style.top = (y+window.scrollY)+'px';
}
function hideTip(){ tooltipEl().style.opacity=0; }

function bandChart(container, {series, width=760, height=280, yFormat=(v)=>fmt(v), markerX=null, markerLabel='', xLabels=null, yLabel=''}){
  clearNode(container);
  const M = {top:16,right:18,bottom:28,left:58};
  const W=width-M.left-M.right, H=height-M.top-M.bottom;
  const svg = svgEl('svg',{viewBox:`0 0 ${width} ${height}`, width:'100%', height:height, style:'display:block; overflow:visible;'});
  const g = svgEl('g',{transform:`translate(${M.left},${M.top})`});
  svg.appendChild(g);

  const xs = series.centre.map(d=>d.x);
  const allY = [...series.lower.map(d=>d.y), ...series.upper.map(d=>d.y)];
  let yMin = Math.min(...allY), yMax = Math.max(...allY);
  if(markerX!==null && series.marker) { yMin=Math.min(yMin, series.marker.y); yMax=Math.max(yMax, series.marker.y); }
  const pad = (yMax-yMin)*0.12 || yMax*0.05;
  yMin -= pad; yMax += pad;
  const xScale = x => (x-xs[0])/(xs[xs.length-1]-xs[0]) * W;
  const yScale = y => H - (y-yMin)/(yMax-yMin) * H;

  const step = niceStep(yMax-yMin, 5);
  const gridStart = Math.ceil(yMin/step)*step;
  for(let v=gridStart; v<=yMax; v+=step){
    g.appendChild(svgEl('line',{x1:0,x2:W,y1:yScale(v),y2:yScale(v), class:'grid-line'}));
    const t = svgEl('text',{x:-8,y:yScale(v)+4,'text-anchor':'end', class:'axis-label'}); t.textContent = yFormat(v); g.appendChild(t);
  }
  (xLabels||xs).forEach((lab,i)=>{
    if(i%Math.ceil(xs.length/13)!==0 && i!==xs.length-1) return;
    const t = svgEl('text',{x:xScale(xs[i]), y:H+18, 'text-anchor':'middle', class:'axis-label'}); t.textContent = lab; g.appendChild(t);
  });

  const bandPath = series.lower.map((d,i)=>`${i===0?'M':'L'}${xScale(d.x)},${yScale(d.y)}`).join(' ') +
    ' ' + series.upper.slice().reverse().map(d=>`L${xScale(d.x)},${yScale(d.y)}`).join(' ') + ' Z';
  g.appendChild(svgEl('path',{d:bandPath, fill:'var(--petrol-200)', opacity:'0.28', stroke:'none'}));

  function linePath(pts){ return pts.map((d,i)=>`${i===0?'M':'L'}${xScale(d.x)},${yScale(d.y)}`).join(' '); }
  g.appendChild(svgEl('path',{d:linePath(series.lower), fill:'none', stroke:'var(--petrol-300)', 'stroke-width':1.5, 'stroke-dasharray':'3,3'}));
  g.appendChild(svgEl('path',{d:linePath(series.upper), fill:'none', stroke:'var(--petrol-300)', 'stroke-width':1.5, 'stroke-dasharray':'3,3'}));
  g.appendChild(svgEl('path',{d:linePath(series.centre), fill:'none', stroke:'var(--cat-1)', 'stroke-width':2.5, 'stroke-linecap':'round'}));

  if(series.marker){
    const mx = xScale(series.marker.x), my = yScale(series.marker.y);
    g.appendChild(svgEl('line',{x1:mx,x2:mx,y1:0,y2:H, stroke:'var(--ink-800)', 'stroke-width':1, 'stroke-dasharray':'2,3', opacity:0.55}));
    const outOfBand = series.marker.status && series.marker.status!=='Inside band';
    g.appendChild(svgEl('circle',{cx:mx,cy:my,r:5.5, fill: outOfBand?'var(--risk-high)':'var(--cat-2)', stroke:'#fff', 'stroke-width':2}));
    const lbl = svgEl('text',{x:mx, y:-4, 'text-anchor':'middle', class:'axis-label', style:'font-weight:700;'}); lbl.textContent = markerLabel; g.appendChild(lbl);
  }

  series.centre.forEach((d,i)=>{
    const hit = svgEl('rect',{x:xScale(d.x)-9, y:0, width:18, height:H, fill:'transparent'});
    hit.addEventListener('mousemove', e=>showTip(e, `<b>${(xLabels?xLabels[i]:'Month '+d.x)}</b>Lower ${yFormat(series.lower[i].y)}<br>Centre ${yFormat(d.y)}<br>Upper ${yFormat(series.upper[i].y)}`));
    hit.addEventListener('mouseleave', hideTip);
    g.appendChild(hit);
  });

  container.appendChild(svg);
}

function barChart(container, {data, width=760, height=260, colorFn, thresholds=[], yFormat=v=>fmt(v,1), valueFormat=v=>fmt(v,1), yLabel=''}){
  clearNode(container);
  const M={top:18,right:18,bottom:34,left:46};
  const W=width-M.left-M.right, H=height-M.top-M.bottom;
  const svg = svgEl('svg',{viewBox:`0 0 ${width} ${height}`, width:'100%', height:height, style:'display:block; overflow:visible;'});
  const g = svgEl('g',{transform:`translate(${M.left},${M.top})`}); svg.appendChild(g);
  const allV = [...data.map(d=>d.value), ...thresholds.map(t=>t.value), 0];
  let vMax = Math.max(...allV), vMin = Math.min(...allV);
  const pad = (vMax-vMin)*0.15 || Math.abs(vMax)*0.15 || 1;
  vMax += pad; vMin -= (vMin<0? pad : 0);
  const yScale = v => H - (v-vMin)/(vMax-vMin)*H;
  const baseY = yScale(0);
  const step = niceStep(vMax-vMin,5);
  const gridStart = Math.ceil(vMin/step)*step;
  for(let v=gridStart; v<=vMax; v+=step){ g.appendChild(svgEl('line',{x1:0,x2:W,y1:yScale(v),y2:yScale(v),class:'grid-line'}));
    const t=svgEl('text',{x:-8,y:yScale(v)+4,'text-anchor':'end',class:'axis-label'}); t.textContent=yFormat(v); g.appendChild(t); }
  thresholds.forEach(th=>{
    const y = yScale(th.value);
    g.appendChild(svgEl('line',{x1:0,x2:W,y1:y,y2:y,stroke:'var(--slate-400)','stroke-width':1,'stroke-dasharray':'4,3'}));
    const t=svgEl('text',{x:W,y:y-4,'text-anchor':'end',class:'axis-label'}); t.textContent=th.label; g.appendChild(t);
  });
  const n=data.length, bw = Math.min(64, W/n*0.5), gap = W/n;
  data.forEach((d,i)=>{
    const x = gap*i + gap/2 - bw/2;
    const y = yScale(d.value);
    const top = Math.min(y, baseY), h = Math.max(Math.abs(y-baseY), 1.5);
    const bar = svgEl('rect',{x, y:top, width:bw, height:h, rx:3, fill:colorFn(d)});
    bar.addEventListener('mousemove', e=>showTip(e, `<b>${d.label}</b>${valueFormat(d.value)}${d.sub?('<br>'+d.sub):''}`));
    bar.addEventListener('mouseleave', hideTip);
    g.appendChild(bar);
    const lbl = svgEl('text',{x:gap*i+gap/2, y:H+18,'text-anchor':'middle', class:'axis-label', style:'font-weight:600;'}); lbl.textContent=d.label; g.appendChild(lbl);
    const val = svgEl('text',{x:gap*i+gap/2, y: d.value>=0 ? top-8 : top+h+14,'text-anchor':'middle', class:'axis-label', style:'font-weight:700; font-size:11px;'}); val.textContent=valueFormat(d.value); g.appendChild(val);
  });
  container.appendChild(svg);
}

}

function areaChart(container, {points, width=760, height=240, color='var(--cat-1)', fillOpacity=0.16, yFormat=v=>fmt(v,1), xLabels, secondaryLine=null, thresholdLines=[]}){
  clearNode(container);
  const M={top:16,right:18,bottom:26,left:50};
  const W=width-M.left-M.right, H=height-M.top-M.bottom;
  const svg = svgEl('svg',{viewBox:`0 0 ${width} ${height}`, width:'100%', height:height, style:'display:block; overflow:visible;'});
  const g = svgEl('g',{transform:`translate(${M.left},${M.top})`}); svg.appendChild(g);
  const allY = points.map(p=>p.y).concat(secondaryLine?secondaryLine.map(p=>p.y):[]).concat(thresholdLines.map(t=>t.value));
  let yMin=Math.min(0,...allY), yMax=Math.max(...allY); const pad=(yMax-yMin)*0.1||1; yMax+=pad;
  const xScale = i => (i/(points.length-1))*W;
  const yScale = v => H - (v-yMin)/(yMax-yMin)*H;
  const step = niceStep(yMax-yMin,5); const gridStart=Math.ceil(yMin/step)*step;
  for(let v=gridStart; v<=yMax; v+=step){ g.appendChild(svgEl('line',{x1:0,x2:W,y1:yScale(v),y2:yScale(v),class:'grid-line'}));
    const t=svgEl('text',{x:-8,y:yScale(v)+4,'text-anchor':'end',class:'axis-label'}); t.textContent=yFormat(v); g.appendChild(t); }
  thresholdLines.forEach(th=>{ const y=yScale(th.value);
    g.appendChild(svgEl('line',{x1:0,x2:W,y1:y,y2:y,stroke:th.color||'var(--risk-high)','stroke-width':1,'stroke-dasharray':'4,3'}));
    const t=svgEl('text',{x:W,y:y-4,'text-anchor':'end',class:'axis-label',style:`fill:${th.color||'var(--risk-high)'}`}); t.textContent=th.label; g.appendChild(t); });
  const areaPath = `M0,${yScale(0)} ` + points.map((p,i)=>`L${xScale(i)},${yScale(p.y)}`).join(' ') + ` L${W},${yScale(0)} Z`;
  g.appendChild(svgEl('path',{d:areaPath, fill:color, opacity:fillOpacity, stroke:'none'}));
  const linePath = points.map((p,i)=>`${i===0?'M':'L'}${xScale(i)},${yScale(p.y)}`).join(' ');
  g.appendChild(svgEl('path',{d:linePath, fill:'none', stroke:color, 'stroke-width':2.5, 'stroke-linecap':'round'}));
  if(secondaryLine){ const sp = secondaryLine.map((p,i)=>`${i===0?'M':'L'}${xScale(i)},${yScale(p.y)}`).join(' ');
    g.appendChild(svgEl('path',{d:sp, fill:'none', stroke:'var(--cat-2)', 'stroke-width':2, 'stroke-dasharray':'5,3'})); }
  points.forEach((p,i)=>{
    if(i%Math.ceil(points.length/12)===0 || i===points.length-1){
      const t=svgEl('text',{x:xScale(i),y:H+16,'text-anchor':'middle',class:'axis-label'}); t.textContent=xLabels[i]; g.appendChild(t);
    }
    const hit=svgEl('rect',{x:xScale(i)-(W/points.length)/2,y:0,width:W/points.length,height:H,fill:'transparent'});
    hit.addEventListener('mousemove', e=>showTip(e, `<b>${xLabels[i]}</b>${p.tip||yFormat(p.y)}`));
    hit.addEventListener('mouseleave', hideTip);
    g.appendChild(hit);
  });
  container.appendChild(svg);
}

function gateGauge(container, {value, max, zones, label}){
  clearNode(container);
  const track = document.createElement('div'); track.className='gate-track';
  zones.forEach(z=>{
    const seg=document.createElement('div');
    seg.style.width=((Math.min(z.to,max)-z.from)/max*100)+'%';
    seg.style.background=z.color;
    track.appendChild(seg);
  });
  const wrap = document.createElement('div'); wrap.className='gate-ladder';
  wrap.appendChild(track);
  const marker=document.createElement('div'); marker.className='gate-marker';
  const pct = Math.max(0,Math.min(1,value/max))*100;
  marker.style.left = pct+'%';
  const flag=document.createElement('div'); flag.className='flag'; flag.textContent=fmt(value,1)+'w';
  marker.appendChild(flag); wrap.appendChild(marker);
  const labels=document.createElement('div'); labels.className='gate-labels';
  zones.forEach(z=>{ if(z.tick===undefined) return;
    const sp=document.createElement('span'); sp.style.left=(z.tick/max*100)+'%'; sp.textContent=z.tickLabel; labels.appendChild(sp); });
  wrap.appendChild(labels);
  container.appendChild(wrap);
}

function donutChart(container, {segments, size=170, centerLabel, centerValue}){
  clearNode(container);
  const cx=size/2, cy=size/2, r=size/2-14, stroke=22;
  const total = segments.reduce((a,s)=>a+s.value,0)||1;
  const svg=svgEl('svg',{viewBox:`0 0 ${size} ${size}`, width:size, height:size});
  let acc=-90;
  segments.forEach(seg=>{
    const frac=seg.value/total, deg=frac*360;
    const large = deg>180?1:0;
    const a0=acc*Math.PI/180, a1=(acc+deg)*Math.PI/180;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const path=svgEl('path',{d:`M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1}`, fill:'none', stroke:seg.color, 'stroke-width':stroke, 'stroke-linecap':seg.round?'round':'butt'});
    path.addEventListener('mousemove', e=>showTip(e, `<b>${seg.label}</b>${fmt(seg.value,2)} MMT (${(frac*100).toFixed(0)}%)`));
    path.addEventListener('mouseleave', hideTip);
    svg.appendChild(path);
    acc+=deg;
  });
  const t1=svgEl('text',{x:cx,y:cy-2,'text-anchor':'middle', style:'font-family:var(--font-mono); font-size:20px; font-weight:700; fill:var(--text-strong);'}); t1.textContent=centerValue; svg.appendChild(t1);
  const t2=svgEl('text',{x:cx,y:cy+16,'text-anchor':'middle', style:'font-size:9.5px; fill:var(--text-muted); letter-spacing:.04em;'}); t2.textContent=centerLabel; svg.appendChild(t2);
  container.appendChild(svg);
}

function multiLineChart(container, {series, width=760, height=280, xTicks, xFormat=v=>v, yFormat=v=>fmt(v)}){
  clearNode(container);
  const M={top:16,right:18,bottom:30,left:60};
  const W=width-M.left-M.right, H=height-M.top-M.bottom;
  const svg=svgEl('svg',{viewBox:`0 0 ${width} ${height}`, width:'100%', height:height, style:'display:block; overflow:visible;'});
  const g=svgEl('g',{transform:`translate(${M.left},${M.top})`}); svg.appendChild(g);
  const xs = series[0].points.map(p=>p.x);
  const allY = series.flatMap(s=>s.points.map(p=>p.y));
  let yMin=Math.min(...allY), yMax=Math.max(...allY); const pad=(yMax-yMin)*0.1; yMin-=pad; yMax+=pad;
  const xScale = x => (x-xs[0])/(xs[xs.length-1]-xs[0])*W;
  const yScale = y => H - (y-yMin)/(yMax-yMin)*H;
  const step=niceStep(yMax-yMin,5); const gridStart=Math.ceil(yMin/step)*step;
  for(let v=gridStart; v<=yMax; v+=step){ g.appendChild(svgEl('line',{x1:0,x2:W,y1:yScale(v),y2:yScale(v),class:'grid-line'}));
    const t=svgEl('text',{x:-8,y:yScale(v)+4,'text-anchor':'end',class:'axis-label'}); t.textContent=yFormat(v); g.appendChild(t); }
  xs.forEach((x,i)=>{ if(!xTicks.includes(x)) return;
    const t=svgEl('text',{x:xScale(x),y:H+18,'text-anchor':'middle',class:'axis-label'}); t.textContent=xFormat(x); g.appendChild(t); });
  series.forEach(s=>{
    const path=s.points.map((p,i)=>`${i===0?'M':'L'}${xScale(p.x)},${yScale(p.y)}`).join(' ');
    g.appendChild(svgEl('path',{d:path, fill:'none', stroke:s.color, 'stroke-width':2.5, 'stroke-linecap':'round'}));
    const last=s.points[s.points.length-1];
    g.appendChild(svgEl('circle',{cx:xScale(last.x),cy:yScale(last.y),r:4,fill:s.color,stroke:'var(--bg-card)','stroke-width':2}));
  });
  const hit=svgEl('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});
  hit.addEventListener('mousemove', e=>{
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX-rect.left) * (width/rect.width) - M.left;
    const xVal = xs[0] + (px/W)*(xs[xs.length-1]-xs[0]);
    let idx=0, best=Infinity;
    xs.forEach((x,i)=>{ const d=Math.abs(x-xVal); if(d<best){best=d; idx=i;} });
    const rows = series.map(s=>`<span style="color:${s.color}">●</span> ${s.label}: ${yFormat(s.points[idx].y)}`).join('<br>');
    showTip(e, `<b>${xFormat(xs[idx])}</b>${rows}`);
  });
  hit.addEventListener('mouseleave', hideTip);
  g.appendChild(hit);
  container.appendChild(svg);
}
function clearNode(n){ while(n.firstChild) n.removeChild(n.firstChild); }

/* ============================== SECTION: CORRIDOR MECHANICS ============================== */
function viewCorridor(M){
  const c = M.corridor;
  return `
    <div class="section-head">
      <h2>How the corridor is built — farmer anchor to 12-month carry curve</h2>
      <p>Two formulas do all the work. The farm-viability anchor (FVA) sets the harvest floor from next-season cost of production; the carry curve then raises the centre every month by the true cost of assembling, financing and storing wheat after harvest.</p>
    </div>

    <div class="two-col" style="margin-bottom:18px;">
      <div class="card card-accent-top">
        <div class="card-title">1 — Farm-viability anchor</div>
        <div class="card-sub">FVA = Economic COP × (1 + normal return), rounded to nearest PKR 100</div>
        <div class="kv" style="padding:10px 12px; background:var(--bg-sunken); border-radius:8px; margin-bottom:12px;">
          <span class="k">Delivered economic COP <span style="display:block; font-size:10.5px; margin-top:2px;">output of the granular build on the <button class="reset-btn" data-goto="cop" style="padding:2px 8px; font-size:10.5px; display:inline-flex;">Cost of Production</button> tab</span></span>
          <span class="v" style="font-size:17px;">${fmt(M.cop.deliveredCOP)}</span>
        </div>
        <div class="form-row" style="margin-bottom:12px;">
          <label>Normal farm-business return (%)</label>
          <input id="in-return" type="number" step="0.5"/>
        </div>
        <div class="divider"></div>
        <div class="kv"><span class="k">Raw FVA</span><span class="v">${fmt(M.fvaRaw)}</span></div>
        <div class="kv"><span class="k">Rounded national FVA</span><span class="v" style="color:var(--ncgcl-green); font-size:16px;">${fmt(M.fva)}</span></div>
        <div class="kv"><span class="k">Farm-gate harvest band (±${fmtPct(state.bandHalfWidth,0)})</span><span class="v">${fmt(M.fva*(1-state.bandHalfWidth))} – ${fmt(M.fva*(1+state.bandHalfWidth))}</span></div>
        <div class="divider"></div>
        <div class="card-title" style="font-size:12px;">Carrying-cost assumptions (annual)</div>
        <div class="grid grid-2" style="gap:10px; margin-top:8px;">
          <div class="form-row"><label>Assembly &amp; margin</label><input id="in-assembly" type="number" step="0.5"/></div>
          <div class="form-row"><label>Finance rate</label><input id="in-finance" type="number" step="0.5"/></div>
          <div class="form-row"><label>Storage rate</label><input id="in-storage" type="number" step="0.5"/></div>
          <div class="form-row"><label>Loss / quality rate</label><input id="in-loss" type="number" step="0.5"/></div>
        </div>
        <div class="kv" style="margin-top:10px;"><span class="k">Combined simple carry</span><span class="v">${fmtPct(state.financeRate+state.storageRate+state.lossRate)} p.a. / ${((state.financeRate+state.storageRate+state.lossRate)/12*100).toFixed(2)}% mo.</span></div>
      </div>

      <div class="card">
        <div class="card-title">2 — 12-month carry curve, month ${state.month} selected</div>
        <div class="card-sub">Centre = FVA × [1 + assembly + m × (finance+storage+loss)/12]; band = centre × (1 ∓ ${fmtPct(state.bandHalfWidth,0)})</div>
        <div class="chart-wrap" id="chart-corridor"></div>
        <div class="legend">
          <span><i style="background:var(--petrol-200)"></i>Operating band (±${fmtPct(state.bandHalfWidth,0)})</span>
          <span><i class="line" style="background:var(--cat-1)"></i>Corridor centre</span>
          <span><i class="line" style="background:var(--slate-400); border-top:2px dashed var(--slate-400); background:none;"></i>Lower / upper band</span>
          <span><i style="background:${M.status==='Inside band'?'var(--cat-2)':'var(--risk-high)'}"></i>Observed price (month ${state.month})</span>
        </div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-title">Month-by-month corridor table</div>
      <div class="card-sub">Reproduces Appendix B of the Cabinet draft; PKR/40kg wholesale and PKR/kg flour-equivalent levels</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Month</th><th class="num">Lower</th><th class="num">Centre</th><th class="num">Upper</th><th class="num">Wheat PKR/kg</th><th class="num">Fair atta ceiling</th><th class="num">Atta release trigger</th></tr></thead>
        <tbody>
          ${c.map(m=>`<tr class="${m.m===state.month?'row-strong':''}"><td>${m.m}${m.m===state.month?' ◂ selected':''}</td><td class="num">${fmt(m.lower)}</td><td class="num">${fmt(m.centre)}</td><td class="num">${fmt(m.upper)}</td><td class="num">${fmt(m.centreKg,1)}</td><td class="num">${fmt(m.fairCeiling,1)}</td><td class="num">${fmt(m.releaseTrigger,1)}</td></tr>`).join('')}
        </tbody>
      </table></div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-title">Why the price must rise after harvest</div>
        <p style="font-size:12.8px; color:var(--text-muted); line-height:1.6; margin:0 0 10px;">Wheat is assembled, financed, stored and protected from loss for up to twelve months after harvest. The corridor makes that cost transparent and rules-based instead of leaving it to administrative discretion.</p>
        <div class="pillbar" style="margin-bottom:8px;">
          <div style="width:${(state.financeRate/(state.financeRate+state.storageRate+state.lossRate)*100).toFixed(1)}%; background:var(--cat-1)"></div>
          <div style="width:${(state.storageRate/(state.financeRate+state.storageRate+state.lossRate)*100).toFixed(1)}%; background:var(--cat-2)"></div>
          <div style="width:${(state.lossRate/(state.financeRate+state.storageRate+state.lossRate)*100).toFixed(1)}%; background:var(--cat-5)"></div>
        </div>
        <div class="legend">
          <span><i style="background:var(--cat-1)"></i>Finance ${fmtPct(state.financeRate)}</span>
          <span><i style="background:var(--cat-2)"></i>Storage ${fmtPct(state.storageRate)}</span>
          <span><i style="background:var(--cat-5)"></i>Loss/quality ${fmtPct(state.lossRate)}</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Recalibration rule</div>
        <p style="font-size:12.8px; color:var(--text-muted); line-height:1.6; margin:0;">The annual corridor order fixes every parameter above for the full marketing year. A mid-year change is allowed only for a material data error, a benchmark-quality change, or a declared emergency — never to reach a desired outcome. The order must publish the old value, new value, evidence and impact.</p>
        <div class="divider"></div>
        <div class="kv"><span class="k">Publication of FVA range</span><span class="v">30 September</span></div>
        <div class="kv"><span class="k">Final anchor confirmed</span><span class="v">31 January</span></div>
        <div class="kv"><span class="k">Weekly dashboard</span><span class="v">Every Thursday</span></div>
      </div>
    </div>
  `;
}

/* ============================== SECTION: 2027 STRESS TESTS ============================== */
function caseCard(key, M){
  const cs = M.cases[key];
  const active = key===state.scenario;
  return `
    <div class="card ${active?'card-accent-top':''}" style="${active?'box-shadow:var(--shadow-md);':''}">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;">
        <div class="card-title">${key}</div>
        ${active?'<span class="chip chip-blue" style="padding:2px 8px;">SELECTED</span>':`<button class="reset-btn" style="padding:4px 10px; font-size:11px;" data-select="${key}">Select</button>`}
      </div>
      <div class="card-sub">${key==='Tight'?'Below-average crop, high use':key==='Base'?'Central operating estimate':key==='Surplus'?'Above-average crop, softer use':'Open balance sheet — set any combination'}</div>
      <div class="grid grid-2" style="gap:8px; margin:10px 0;">
        <div class="form-row"><label>Opening (MMT)</label><input class="case-input" data-case="${key}" data-field="opening" type="number" step="0.1" value="${cs.opening}"/></div>
        <div class="form-row"><label>Production (MMT)</label><input class="case-input" data-case="${key}" data-field="production" type="number" step="0.1" value="${cs.production}"/></div>
        <div class="form-row"><label>Domestic use (MMT)</label><input class="case-input" data-case="${key}" data-field="use" type="number" step="0.1" value="${cs.use}"/></div>
        <div class="form-row"><label>External disappearance</label><input class="case-input" data-case="${key}" data-field="external" type="number" step="0.1" value="${cs.external}"/></div>
      </div>
      <div class="divider"></div>
      <div class="kv"><span class="k">Pre-trade ending</span><span class="v">${fmt(cs.preTradeEnding,2)} MMT</span></div>
      <div class="kv"><span class="k">Cover</span><span class="v" style="color:${coverColor(cs.coverWeeks,state)}">${fmt(cs.coverWeeks,1)} weeks</span></div>
      <div class="kv"><span class="k">Import requirement</span><span class="v">${cs.importReq>0?fmt(cs.importReq,2)+' MMT':'—'}</span></div>
      <div class="kv"><span class="k">Export ceiling</span><span class="v">${cs.exportCeil>0?fmt(cs.exportCeil,2)+' MMT':'—'}</span></div>
      <div style="margin-top:10px;"><span class="chip ${actionChipClass(cs.action)}">${cs.action}</span></div>
      <div class="stat-foot" style="margin-top:6px;">${cs.note}</div>
    </div>
  `;
}

        <tbody>
          ${rows.map(r=>`<tr><td>${r.month} '${r.i<9?'27':'28'}</td><td class="num">${fmt(r.production,2)}</td><td class="num">${fmt(r.opening,2)}</td><td class="num">${fmt(r.use,2)}</td><td class="num">${fmt(r.ending,2)}</td><td class="num">${fmt(r.coverWeeks,1)}w</td><td><span class="chip ${r.status==='Emergency cover'?'chip-red':r.status==='Below normal import gate'?'chip-amber':r.status==='Above export-cover gate'?'chip-blue':'chip-green'}" style="padding:2px 8px;">${r.status}</span></td></tr>`).join('')}

/* ============================== SECTION: TRADE GATES & RESERVE ============================== */
function viewTrade(M){
  const sel = M.sel;
  const zones = [
    { from:0, to:state.emergencyImportGateWeeks, color:'#F4C7C7', tick:0, tickLabel:'0' },
    { from:state.emergencyImportGateWeeks, to:state.normalImportGateWeeks, color:'#F6E3B0', tick:state.emergencyImportGateWeeks, tickLabel:state.emergencyImportGateWeeks+'w emergency' },
    { from:state.normalImportGateWeeks, to:state.exportGateWeeks, color:'#C9E8C6', tick:state.normalImportGateWeeks, tickLabel:state.normalImportGateWeeks+'w import gate' },
    { from:state.exportGateWeeks, to:20, color:'#BBD8E8', tick:state.replenishmentWeeks, tickLabel:state.replenishmentWeeks+'w replenish' },
  ];
  return `
    <div class="section-head">
      <h2>Foreign trade gates require both a price signal and a stock signal</h2>
      <p>A price breach alone cannot open imports or exports. A stock signal alone cannot either — except the below-six-week emergency rule, which waives the price test entirely. The ladder below places the ${state.scenario} case's ${fmt(sel.coverWeeks,1)}-week cover on the same scale as every gate.</p>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-title">Stock-cover gate ladder — ${state.scenario} case</div>
      <div class="card-sub">0–6 weeks emergency · 6–8 weeks tight (import gate active on price breach) · 8–14 weeks normal · &gt;14 weeks export-eligible</div>
      <div id="gate-ladder-wrap"></div>
      <div class="legend" style="margin-top:26px;">
        <span><i style="background:#F4C7C7"></i>Emergency (&lt;${state.emergencyImportGateWeeks}w)</span>
        <span><i style="background:#F6E3B0"></i>Tight (${state.emergencyImportGateWeeks}–${state.normalImportGateWeeks}w)</span>
        <span><i style="background:#C9E8C6"></i>Normal (${state.normalImportGateWeeks}–${state.exportGateWeeks}w)</span>
        <span><i style="background:#BBD8E8"></i>Export-eligible (&gt;${state.exportGateWeeks}w)</span>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:18px;">
      <div class="stat-tile ${M.normalImportGate?'accent-red':''}">
        <div class="stat-label">Normal import gate</div>
        <div class="stat-value" style="font-size:19px;">${M.normalImportGate?'TRIGGER':'NO'}</div>
        <div class="stat-foot">Price above upper for ${state.daysAboveUpper}d AND cover &lt;${state.normalImportGateWeeks}w</div>
      </div>
      <div class="stat-tile ${M.emergencyImportGate?'accent-red':''}">
        <div class="stat-label">Emergency import gate</div>
        <div class="stat-value" style="font-size:19px;">${M.emergencyImportGate?'TRIGGER':'NO'}</div>
        <div class="stat-foot">Cover &lt;${state.emergencyImportGateWeeks}w — price test waived</div>
      </div>
      <div class="stat-tile ${M.exportGate?'accent-amber':''}">
        <div class="stat-label">Export consideration gate</div>
        <div class="stat-value" style="font-size:19px;">${M.exportGate?'CONSIDER':'NO'}</div>
        <div class="stat-foot">Price below lower for ${state.daysBelowLower}d AND cover &gt;${state.exportGateWeeks}w</div>
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-title">Gate parameters</div>
        <div class="card-sub">Editable — annual order values shown as defaults</div>
        <div class="grid grid-2" style="gap:10px;">
          <div class="form-row"><label>Normal import gate (weeks)</label><input id="in-normalgate" type="number" step="0.5"/></div>
          <div class="form-row"><label>Emergency import gate (weeks)</label><input id="in-emergate" type="number" step="0.5"/></div>
          <div class="form-row"><label>Replenishment objective (weeks)</label><input id="in-replen" type="number" step="0.5"/></div>
          <div class="form-row"><label>Export consideration gate (weeks)</label><input id="in-exportgate" type="number" step="0.5"/></div>
          <div class="form-row"><label>Post-export cover floor (weeks)</label><input id="in-postexport" type="number" step="0.5"/></div>
          <div class="form-row"><label>Accessible public reserve (MMT)</label><input id="in-reserve" type="number" step="0.1"/></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Reserve after an indicative flour release</div>
        <div class="card-sub">Emergency core is protected — routine releases draw only the rotating tranche</div>
        <div class="kv"><span class="k">Flour release test</span><span class="v"><span class="chip ${M.flour.trigger?'chip-red':'chip-green'}" style="padding:2px 8px;">${M.flour.trigger?'TRIGGER':'NO TRIGGER'}</span></span></div>
        <div class="kv"><span class="k">Indicative release quantity</span><span class="v">${fmt(M.indicativeReleaseQty,2)} MMT</span></div>
        <div class="kv"><span class="k">Reserve after release</span><span class="v">${fmt(M.reserveAfterRelease,2)} MMT</span></div>
        <div class="kv"><span class="k">Emergency core protected?</span><span class="v">${M.reserveAfterRelease>=M.reserve.emergencyCore?'✓ Yes':'✗ No — review'}</span></div>
        <div class="divider"></div>
        <div class="card-title" style="font-size:12px;">Import / export quantity formulas</div>
        <div class="kv"><span class="k">Import requirement</span><span class="v">${fmt(sel.importReq,2)} MMT</span></div>
        <div class="kv"><span class="k">Export ceiling</span><span class="v">${fmt(sel.exportCeil,2)} MMT</span></div>
        <div class="stat-foot" style="margin-top:8px;">Import = max[0, ${state.replenishmentWeeks}wk × weekly use − forward stock]. Export = max[0, forward stock − ${state.postExportFloorWeeks}wk × weekly use]. Executed in ${fmt(state.tradeTrancheMin,2)}–${fmt(state.tradeTrancheMax,2)} MMT tranches, reviewed every 30 days.</div>
      </div>
    </div>
  `;
}

/* ============================== SECTION: FLOUR & MILLING ============================== */
function viewFlour(M){
  const f = M.flour;
  return `

      <h2>The flour trigger compares matched wheat and atta — not an administrative cap</h2>
      <p>A blanket flour-price cap ignores the wheat acquisition price, extraction yields, by-product value and milling cost — it cannot create supply at the capped price. The corridor instead publishes a break-even ratio (R*) and releases public stock only when both the ratio and the crush-adjusted margin breach for ten business days.</p>
    </div>

    <div class="two-col" style="margin-bottom:18px;">
      <div class="card card-accent-top green">
        <div class="card-title">Crush-economics calculator</div>
        <div class="card-sub">R* = (1 + processing cost − bran yield × bran value) ÷ (atta yield + maida yield × maida value)</div>
        <div class="grid grid-2" style="gap:10px; margin-bottom:12px;">
          <div class="form-row"><label>Atta yield (%)</label><input id="in-attayield" type="number" step="1"/></div>
          <div class="form-row"><label>Maida/suji yield (%)</label><input id="in-maidayield" type="number" step="1"/></div>
          <div class="form-row"><label>Bran yield (%)</label><input id="in-branyield" type="number" step="1"/></div>
          <div class="form-row"><label>Processing / channel cost (%)</label><input id="in-proccost" type="number" step="0.5"/></div>
          <div class="form-row"><label>Maida value (× atta)</label><input id="in-maidamult" type="number" step="0.05"/></div>
          <div class="form-row"><label>Bran value (× wheat)</label><input id="in-branmult" type="number" step="0.05"/></div>
        </div>
        <div class="kv"><span class="k">Yield check (must = 100%)</span><span class="v" style="color:${Math.abs(f.yieldSum-1)<0.001?'var(--ncgcl-green)':'var(--risk-high)'}">${fmtPct(f.yieldSum,0)}</span></div>
        <div class="kv"><span class="k">Break-even ratio R*</span><span class="v">${f.Rstar.toFixed(4)}×</span></div>
        <div class="kv"><span class="k">Fair-ceiling ratio (R*+${fmtPct(state.fairCeilingAdd,0)})</span><span class="v">${f.fairCeiling.toFixed(4)}×</span></div>
        <div class="kv"><span class="k">Release-boundary ratio</span><span class="v" style="color:var(--ncgcl-green); font-weight:700;">${f.releaseBoundary.toFixed(4)}×</span></div>
      </div>

      <div class="card">
        <div class="card-title">Live matched-price trigger</div>
        <div class="card-sub">Same grade, date and location comparison — mill-gate wheat vs ex-mill/retail atta</div>

          <div class="form-row"><label>Matched atta price (PKR/kg)</label><input id="in-atta2" type="number" step="0.5"/></div>

          <div class="form-row"><label>Target net spread (%)</label><input id="in-targetspread" type="number" step="0.5"/></div>
        </div>
        <div class="kv"><span class="k">Observed atta/wheat ratio</span><span class="v">${f.observedRatio.toFixed(4)}×</span></div>
        <div class="kv"><span class="k">Crush-adjusted net spread</span><span class="v" style="color:${f.netSpread>=state.targetNetSpread?'var(--risk-high)':'var(--ncgcl-green)'}">${fmtPct(f.netSpread,1)}</span></div>
        <div class="kv"><span class="k">Ratio above boundary?</span><span class="v">${f.ratioBreach?'Yes':'No'}</span></div>
        <div class="kv"><span class="k">Spread above target?</span><span class="v">${f.spreadBreach?'Yes':'No'}</span></div>
        <div class="kv"><span class="k">Persistence ≥ ${state.flourPersistenceDays}d?</span><span class="v">${f.persistenceOK?'Yes':'No'}</span></div>
        <div style="margin-top:12px; text-align:center; padding:12px; border-radius:8px; background:${f.trigger?'#FCE8E8':'var(--green-100)'};">

        </div>
      </div>

      <div class="card-title">Historical flour/wheat ratio and crush-adjusted net spread, 2020–2026</div>

        <div class="stat-tile"><div class="stat-label">1. Publish lot</div><div class="stat-foot">Quality, location, reserve price, atta specification, delivery window</div></div>

        <div class="stat-tile"><div class="stat-label">3. Award &amp; deliver</div><div class="stat-foot">Ranked by verified consumer saving; performance security required</div></div>
        <div class="stat-tile accent-red"><div class="stat-label">4. Verify or recover</div><div class="stat-foot">Pass-through failure ⇒ payment recovery, exclusion, referral</div></div>
      </div>
    </div>
  `;
}

/* ============================== SECTION: FARMER FINANCE ============================== */

          <tbody>${DRAW_SCHEDULE.map(d=>`<tr><td>${d.stage}</td><td>${d.timing}</td><td class="num">${fmt(d.outflow,0)}</td><td class="num">${d.months}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="stat-foot" style="margin-top:8px;">Weighted average duration ≈ 4.43 months against a PKR ${fmt(state.tradedInputBase,0)} traded-input base — not a flat 6-month charge on the full crop cost.</div>
      </div>
      <div class="card">
        <div class="card-title">Cost of production build</div>
        <div class="card-sub">Gross cultivation cost PKR ${fmt(M.copGross,0)}/acre at ${fmt(ff.yieldMaunds,1)} maunds/acre — now a live output, not a fixed benchmark</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Component</th><th class="num">PKR/acre</th><th class="num">Share</th></tr></thead>
          <tbody>${copComponentRows(M.cop).map(c=>`<tr><td>${c.item}</td><td class="num">${fmt(c.acre,0)}</td><td class="num">${fmtPct(c.acre/M.copGross,1)}</td></tr>`).join('')}</tbody>
        </table></div>
        <div style="margin-top:10px;"><button class="reset-btn" data-goto="cop">${icon('sliders','icon')} Open the full granular builder</button></div>
      </div>
    </div>
  `;
}

/* ============================== SECTION: POLICY RULEBOOK ============================== */

  return `

      <h2>One operational map from evidence to trigger</h2>

    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-title">National decision matrix</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Price condition</th><th>Stock condition</th><th>Persistence</th><th>Primary instrument</th><th>Quantity rule</th><th>Safeguard</th></tr></thead>
        <tbody>${DECISION_MATRIX.map(r=>`<tr><td>${r.price}</td><td>${r.stock}</td><td>${r.persistence}</td><td>${r.instrument}</td><td>${r.qty}</td><td>${r.safeguard}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="card" style="margin-bottom:18px;">
      <div class="card-title">Instrument hierarchy — least-distorting first</div>
      <div class="card-sub">The Wheat Corridor Committee may move to a later instrument only when it records why the earlier one is unavailable, insufficient or too slow</div>
      <div class="table-wrap"><table>
        <thead><tr><th class="num">Order</th><th>Instrument</th><th>Problem solved</th><th>Entry test</th><th>Exit test</th><th>Fiscal safeguard</th></tr></thead>
        <tbody>${INSTRUMENT_HIERARCHY.map(r=>`<tr><td class="num">${r.order}</td><td>${r.instrument}</td><td>${r.problem}</td><td>${r.entry}</td><td>${r.exit}</td><td>${r.fiscal}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="grid grid-2">
      <div class="callout callout-impact">
        <div>${icon('shield','icon')}</div>
        <div><b>Not an open-ended promise</b>The corridor is not an open-ended procurement promise and does not guarantee a private trader margin. It defines an operating zone and a rules-based sequence of actions.</div>

      <div class="callout callout-action">
        <div>${icon('split','icon')}</div>
        <div><b>National gate for foreign trade</b>Foreign trade requires a national trigger. Provincial breaches authorize domestic movement and logistics responses only — never an independent import or export.</div>

}

/* ============================== RENDER ORCHESTRATION ============================== */
const VIEW_FN = { overview:viewOverview, cop:viewCOP, corridor:viewCorridor, stress:viewStress, provincial:viewProvincial, trade:viewTrade, flour:viewFlour, farmer:viewFarmer, rulebook:viewRulebook, methodology:viewMethodology };

function wireCorridorInputs(){
  bindNum('in-return','normalReturn',{pct:true});
  bindNum('in-assembly','assemblyMargin',{pct:true});
  bindNum('in-finance','financeRate',{pct:true});
  bindNum('in-storage','storageRate',{pct:true});
  bindNum('in-loss','lossRate',{pct:true});
}
function wireStressInputs(){
  document.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('click', ()=>{ state.scenario=b.dataset.select; render(); }));
  document.querySelectorAll('.case-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const v = parseFloat(inp.value); if(isNaN(v)) return;
      state.cases[inp.dataset.case][inp.dataset.field] = v;
      render();
    });
  });
}
function wireTradeInputs(){
  bindNum('in-normalgate','normalImportGateWeeks');
  bindNum('in-emergate','emergencyImportGateWeeks');
  bindNum('in-replen','replenishmentWeeks');
  bindNum('in-exportgate','exportGateWeeks');
  bindNum('in-postexport','postExportFloorWeeks');
  bindNum('in-reserve','accessiblePublicReserve');
}
function wireFlourInputs(){
  bindNum('in-attayield','attaYield',{pct:true});
  bindNum('in-maidayield','maidaYield',{pct:true});
  bindNum('in-branyield','branYield',{pct:true});
  bindNum('in-proccost','processingCost',{pct:true});
  bindNum('in-maidamult','maidaMultiple');
  bindNum('in-branmult','branMultiple');
  bindNum('in-millgate2','millGateWheat');
  bindNum('in-atta2','attaPrice');
  bindNum('in-breachdays','flourBreachDays');
  bindNum('in-targetspread','targetNetSpread',{pct:true});
}
function wireFarmerInputs(){
  const lev = document.getElementById('in-leverage');
  lev.value = state.leverage*100;
  lev.addEventListener('input', ()=>{ state.leverage = parseFloat(lev.value)/100; document.getElementById('leverage-val').textContent = fmt(state.leverage*100,0)+'%'; render(); });
  document.getElementById('in-fundingsource').addEventListener('change', (e)=>{ state.selectedFundingSource = e.target.value; render(); });
  bindNum('in-grainprice','grainPrice');
}

function drawSectionCharts(M){
  if(activeSection==='overview'){}
  if(activeSection==='cop'){
    const el = document.getElementById('chart-cop-mix');
    if(el){
      const rows = copComponentRows(M.cop).sort((a,b)=>b.acre-a.acre);
      hBarChart(el, { data: rows.map(r=>({label:r.item.length>28?r.item.slice(0,26)+'…':r.item, value:r.acre, sub:fmtPct(r.acre/M.cop.grossCost,1)+' of gross cost'})),
        height: rows.length*40+20, colorFn:()=>'var(--cat-1)', valueFormat:v=>fmt(v,0) });
    }
  }
  if(activeSection==='corridor'){
    const el = document.getElementById('chart-corridor'); if(!el) return;
    const c = M.corridor;
    bandChart(el, {
      series:{ lower:c.map(m=>({x:m.m,y:m.lower})), centre:c.map(m=>({x:m.m,y:m.centre})), upper:c.map(m=>({x:m.m,y:m.upper})), marker:{x:state.month, y:state.observedPrice, status:M.status} },
      xLabels:c.map(m=>'M'+m.m), markerLabel:'Observed '+fmt(state.observedPrice), yFormat:v=>fmt(v)
    });
  }
  if(activeSection==='stress'){
    const elc = document.getElementById('chart-cases');
    if(elc){
      barChart(elc, { data:['Tight','Base','Surplus','Custom'].map(k=>({label:k, value:M.cases[k].coverWeeks, sub:M.cases[k].action})),
        colorFn:d=>coverColor(d.value,state), thresholds:[{value:state.emergencyImportGateWeeks,label:state.emergencyImportGateWeeks+'w'},{value:state.normalImportGateWeeks,label:state.normalImportGateWeeks+'w'},{value:state.exportGateWeeks,label:state.exportGateWeeks+'w'}],
        valueFormat:v=>fmt(v,1)+'w' });
    }
    const elm = document.getElementById('chart-monthly');
    if(elm){
      areaChart(elm, { points:M.monthly.map(r=>({y:r.ending, tip:`Ending ${fmt(r.ending,2)} MMT<br>Cover ${fmt(r.coverWeeks,1)}w<br>${r.status}`})), xLabels:M.monthly.map(r=>r.month),
        color:'var(--cat-1)', thresholdLines:[] });
    }
  }
  if(activeSection==='provincial'){
    const el = document.getElementById('chart-provinces');
    if(el){
      hBarChart(el, { data:M.provinces.map(p=>({label:p.short, value:p.coverWeeks, needTo8:p.needTo8, preTransferEnding:p.preTransferEnding,
          sub: p.coverWeeks===0 ? `${p.name} — pre-transfer ending ${fmt(p.preTransferEnding,2)} MMT (already short of use); floored at 0 weeks, not negative. Needs ${fmt(p.needTo8,2)} MMT transferred in to reach the 8-week floor.` : p.name })),
        colorFn:d=>coverColor(d.value,state),
        thresholds:[{value:8,label:'8w'},{value:10,label:'10w'}],
        valueFormat:(v,d)=> v===0 ? `0.0w · needs ${fmt(d.needTo8,2)}` : fmt(v,1)+'w' });
    }
    const dd = document.getElementById('chart-reserve-donut');
    if(dd){ donutChart(dd, { segments:[{label:'Emergency core',value:M.reserve.emergencyCore,color:'var(--cat-1)'},{label:'Rotating tranche',value:M.reserve.rotatingTranche,color:'var(--cat-2)'}], centerValue:fmt(M.reserve.targetReserve,2), centerLabel:'MMT TARGET' }); }
  }
  if(activeSection==='trade'){
    const gl = document.getElementById('gate-ladder-wrap');
    if(gl){
      const zones = [
        { from:0, to:state.emergencyImportGateWeeks, color:'#F4C7C7' },
        { from:state.emergencyImportGateWeeks, to:state.normalImportGateWeeks, color:'#F6E3B0' },
        { from:state.normalImportGateWeeks, to:state.exportGateWeeks, color:'#C9E8C6' },
        { from:state.exportGateWeeks, to:20, color:'#BBD8E8' },
      ];
      gateGauge(gl, { value:M.sel.coverWeeks, max:20, zones:[
        {...zones[0], tick:0, tickLabel:'0'}, {...zones[1], tick:state.emergencyImportGateWeeks, tickLabel:state.emergencyImportGateWeeks+'w'},
        {...zones[2], tick:state.normalImportGateWeeks, tickLabel:state.normalImportGateWeeks+'w'}, {...zones[3], tick:state.exportGateWeeks, tickLabel:state.exportGateWeeks+'w'},
        {tick:20, tickLabel:'20w', from:20,to:20,color:'transparent'}
      ]});
    }
  }
  if(activeSection==='flour'){
    const el = document.getElementById('chart-flour-history');
    if(el){
      barChart(el, { data:FLOUR_HISTORY.map(h=>({label:h.period.replace('Jan–May ',''), value:h.spread*100, sub:'Ratio '+h.ratio.toFixed(3)})),
        colorFn:d=>d.value>=state.targetNetSpread*100?'var(--risk-high)':d.value>=0?'var(--risk-med)':'var(--ncgcl-green)',
        thresholds:[{value:state.targetNetSpread*100, label:fmtPct(state.targetNetSpread,0)+' target'}], valueFormat:v=>fmtSigned(v,1)+'%', yFormat:v=>v.toFixed(0)+'%' });
    }
  }
  if(activeSection==='farmer'){
    const el = document.getElementById('chart-breakeven');
    if(el){
      const series = RATE_OPTIONS.map(r=>({ label:r.label, color:r.seq, points: M.farmerFinance.table.map(row=>({x:row.leverage*100, y:row[r.key]})) }));
      multiLineChart(el, { series, xTicks:[0,25,50,75,100], xFormat:v=>v+'%', yFormat:v=>fmt(v) });
    }
  }
}

function renderSectionHost(){
  const M = computeAll(state);
  const host = document.getElementById('section-host');
  host.innerHTML = `<div class="view active">${VIEW_FN[activeSection](M)}</div>`;
  if(activeSection==='cop') wireCopInputs();
  if(activeSection==='corridor') wireCorridorInputs();
  if(activeSection==='stress') wireStressInputs();
  if(activeSection==='trade') wireTradeInputs();
  if(activeSection==='flour') wireFlourInputs();
  if(activeSection==='farmer') wireFarmerInputs();
  host.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>{ activeSection=b.dataset.goto; renderNavActive(); renderSectionHost(); window.scrollTo(0,0); }));
  requestAnimationFrame(()=>drawSectionCharts(M));
}

function updateModelStatusChip(M){
  const chip = document.getElementById('model-status-chip');
  if(!chip) return;
  const ok = Math.abs(M.flour.yieldSum-1)<0.001;
  chip.innerHTML = (ok? icon('check','icon') : icon('alert','icon')) + (ok?' MODEL OK':' CHECK FAILED');
}

function render(){
  const scrollY = window.scrollY;
  const hostExisted = !!document.getElementById('section-host');
  if(!hostExisted){ renderShell(); }
  renderControlStrip();
  renderNavActive();
  renderSectionHost();
  const M = computeAll(state);
  updateModelStatusChip(M);
  if(!hostExisted) window.scrollTo(0,0); else window.scrollTo(0,scrollY);
}

render();
</script>
